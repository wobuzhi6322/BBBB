<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="계이득 공지사항 — 새 기능, 점검, 이벤트 등 계이득의 새로운 소식을 확인하세요."
    />
    <title>공지사항 - 계이득</title>
    <link rel="icon" type="image/png" href="/assets/gyeideuk-logo.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="계이득" />
    <meta property="og:title" content="공지사항 - 계이득" />
    <meta
      property="og:description"
      content="계이득의 새 기능, 점검, 이벤트 소식을 이곳에서 알려드려요."
    />
    <meta property="og:url" content="https://www.gaeideuk.com/notices" />
    <meta property="og:image" content="https://www.gaeideuk.com/assets/gyeideuk-logo.png" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="공지사항 - 계이득" />
    <meta
      name="twitter:description"
      content="계이득의 새 기능, 점검, 이벤트 소식을 이곳에서 알려드려요."
    />
    <meta name="twitter:image" content="https://www.gaeideuk.com/assets/gyeideuk-logo.png" />

    <script>
      (() => {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem("bbbb-site-theme");
        } catch {
          savedTheme = null;
        }
        document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="/assets/site.css" />
    <link rel="stylesheet" href="/assets/web-tokens.css" />
    <link rel="stylesheet" href="/assets/web-notices.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="/assets/web-common.js"></script>
    <script defer src="/assets/web-viewer-nav.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="계이득 홈">
        <img class="brand-logo" src="/assets/gyeideuk-logo.png" alt="계이득" />
      </a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="/channels">채널 탐색</a>
        <a href="/guide">이용 가이드</a>
        <a href="/notices" aria-current="page">공지</a>
      </nav>
      <div class="header-actions">
        <button
          id="theme-toggle"
          data-vn-theme
          class="theme-toggle"
          type="button"
          aria-pressed="false"
          aria-label="다크 모드로 전환"
          title="다크 모드로 전환"
        >
          <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20.99 14.31A8.5 8.5 0 0 1 9.69 3.01 9 9 0 1 0 20.99 14.31Z"></path>
          </svg>
        </button>
        <a id="account-button" class="header-account" href="/login?next=%2Fnotices">로그인</a>
      </div>
    </header>

    <main class="nt-main">
      <section class="nt-hero">
        <p class="eyebrow">Notices</p>
        <h1>공지사항</h1>
        <p class="nt-lead">계이득의 새 기능, 점검, 이벤트 소식을 이곳에서 알려드려요.</p>
      </section>

      <section class="nt-board" aria-label="공지 목록">
        <div id="notice-empty" class="nt-empty" role="status">
          <div class="nt-empty-sticker" aria-hidden="true">
            <span class="nt-empty-bubble"></span>
          </div>
          <h2>아직 등록된 공지가 없어요</h2>
          <p>새 소식이 생기면 이곳에 올라옵니다.</p>
        </div>

        <!--
          공지 데이터 소스 연결 시:
            1) #notice-empty 에 hidden 을 주고
            2) #notice-list 의 hidden 을 제거한 뒤 아래 해부도대로 행을 렌더한다.
        -->
        <ul id="notice-list" class="notice-list" hidden>
          <!--
          <li class="notice-item">
            <a class="notice-link" href="/notices">
              <span class="notice-date">2026.07.12</span>
              <span class="notice-copy">
                <span class="notice-title">공지 제목이 들어갑니다</span>
                <span class="notice-summary">공지 본문 요약이 한두 줄로 들어갑니다.</span>
              </span>
            </a>
          </li>
          -->
        </ul>
      </section>
    </main>

    <footer class="nt-footer">
      <a href="/guide">이용 가이드</a>
      <a href="/notices">공지사항</a>
      <a href="/terms.html">이용약관</a>
      <a href="/privacy.html">개인정보처리방침</a>
      <a href="/streamer">스트리머이신가요?</a>
    </footer>
  </body>
</html>
